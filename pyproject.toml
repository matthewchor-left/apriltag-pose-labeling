[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-aruco"
version = "0.1.0"
description = "AprilTag-based table tennis object pose estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10",
    "scipy>=1.11",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]

[project.scripts]
annotation-tool = "object_apriltag.cli.annotation_tool:main"
object-detect = "object_apriltag.cli.detect:main"
object-calibrate-marker-model = "object_apriltag.cli.calibrate_marker_model:main"
object-inspect-marker-model = "object_apriltag.cli.inspect_marker_model:main"
object-charuco = "object_apriltag.cli.charuco:main"
object-projection = "object_apriltag.cli.projection:main"
object-evaluate-marker-model = "object_apriltag.cli.evaluate_marker_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
